<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Studio portfolio website." />

  <title>Studio Portfolio</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Reusable pill nav class */
    .pill-link {
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 500;
      color: #374151; /* gray-700 */
      transition: all 0.25s ease;
    }

    .pill-link:hover {
      color: #111827; /* gray-900 */
    }

    .pill-link.active {
      background: #ffffff;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      color: #111827;
    }
  </style>
</head>

<body class="bg-white text-gray-900">

  <!-- ===== FLOATING PILL NAV ===== -->
  <header class="w-full py-6 flex justify-center fixed top-0 z-50 pointer-events-none">
    <nav
      id="pillNav"
      class="flex items-center gap-1 bg-gray-100 p-1 rounded-full shadow-sm pointer-events-auto"
    >
      <a href="index.html" class="pill-link active">Home</a>
      <a href="work.html" class="pill-link">Work</a>
      <a href="tasks.html" class="pill-link">Tasks</a>
      <a href="about.html" class="pill-link">About</a>
      <a href="contact.html" class="pill-link">Contact</a>
    </nav>
  </header>

  <!-- ===== HERO ===== -->
  <main class="min-h-screen flex items-center justify-center px-6">
    <div class="text-center max-w-3xl">

      <p class="text-sm uppercase tracking-widest text-gray-500 mb-8">
        Design in Details
      </p>

      <h1 class="mb-8">
        <div class="text-[clamp(3rem,6vw,5rem)]">
          <span class="font-medium">Crafted </span>
          <span class="italic font-normal" style="font-family: serif;">
            Websites
          </span>
        </div>

        <div class="text-[clamp(3rem,6vw,5rem)]">
          <span class="font-light">Lasting </span>
          <span class="font-extrabold">
            Impressions
          </span>
        </div>
      </h1>

      <p class="text-lg text-gray-600 mb-10">
        Premium websites and digital tools crafted for modern studios.
      </p>

      <div class="flex justify-center gap-4">
        <a
          href="contact.html"
          class="px-7 py-3 rounded-full bg-black text-white text-sm font-medium hover:bg-gray-800 transition"
        >
          Get in touch
        </a>
        <a
          href="work.html"
          class="px-7 py-3 rounded-full border border-gray-300 text-sm font-medium hover:bg-gray-100 transition"
        >
          See our work
        </a>
      </div>

    </div>
  </main>

  <!-- JS -->
  <script src="assets/js/nav.js"></script>

</body>
</html>
