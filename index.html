<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Home page" />
  <title>Studio Task Manager</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>

  <style>
    /* Minimal custom styling */
    .stm-navbar { 
      backdrop-filter: blur(12px); 
      -webkit-backdrop-filter: blur(12px); 
    }

    .hero-title  { 
      font-size: clamp(3rem, 6vw, 5rem); 
      line-height: 1.1; 
    }

    /* Theme-aware hover */
    .nav-link-stm:hover { 
      color: var(--bs-body-color) !important; 
    }
  </style>
</head>

<body>

  <!-- Header injected from main.js -->
  <div id="header-placeholder"></div>

  <!-- Hero Section -->
  <section class="min-vh-100 d-flex align-items-center justify-content-center px-3">
    <div class="text-center">

      <p class="text-uppercase text-body-secondary small fw-normal mb-4"
         style="letter-spacing:.15em;">
         Design In Details
      </p>

      <h1 class="mb-4">
        <div class="hero-title">
          <span class="fw-bolder">Crafted </span>
          <span class="fw-normal fst-italic" style="font-family:Georgia,serif;">
            Websites
          </span>
        </div>
        <div class="hero-title">
          <span class="fw-light">Lasting </span>
          <span class="fw-bolder">Impressions</span>
        </div>
      </h1>

      <p class="text-body-secondary fs-5 mb-5">
        Premium Digital Solutions for Your Business Needs
      </p>

      <div class="d-flex justify-content-center gap-3">
        <a href="contact.html" 
           class="btn btn-primary rounded-pill px-4 py-2 small fw-medium">
          Get in touch
        </a>

        <a href="tasks.html" 
           class="btn btn-outline-secondary rounded-pill px-4 py-2 small fw-medium">
          See our Tasks
        </a>
      </div>

    </div>
  </section>

  <!-- Weather Section -->
  <section class="py-5" id="weatherSection">
    <div class="container border rounded-4 p-5 bg-primary bg-gradient text-white">

      <div class="text-center mb-5">
        <p class="text-uppercase small text-white-50 mb-2">Live Data</p>
        <h2 class="text-uppercase small text-white-50 mb-1">Your Mom's House</h2>
        <h2 class="fw-bold">Athens Weather</h2>
      </div>

      <div id="weatherCard"
           class="mx-auto p-4 text-center"
           style="max-width: 500px;">

        <div id="weatherLoader">
          <div class="spinner-border text-light" role="status"></div>
        </div>

        <div id="weatherContent" class="d-none"></div>

        <div id="weatherError" class="text-warning d-none">
          Unable to load weather data.
        </div>

      </div>

    </div>
  </section>

  <!-- Footer injected from main.js -->
  <div id="footer-placeholder"></div>

</body>
</html>
