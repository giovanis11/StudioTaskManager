<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Studio Task Analytics</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="assets/js/analytics.js"></script>

<style>
.stm-navbar {
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
</style>

</head>

<body>

<!-- Header -->
<div id="header-placeholder"></div>

<main class="pt-5 mt-4 mt-lg-5 px-3 px-md-4 pb-5">

  <div class="mx-auto w-100" style="max-width:640px;">

    <!-- Page Heading -->
    <div class="text-center mb-4 mb-md-5 pt-3">
      <h1 class="fs-3 fw-semibold">Analytics Dashboard</h1>
      <p class="text-body-secondary small mb-0">
        Visual overview of your studio task performance
      </p>
    </div>

    <!-- KPI Metrics -->
    <section class="mb-4">
      <div class="row g-3">

        <div class="col-6">
          <div class="border border-secondary-subtle rounded-3 p-3 text-center">
            <p class="small text-body-secondary mb-1">Total</p>
            <p id="metricTotal" class="fs-4 fw-semibold mb-0">0</p>
          </div>
        </div>

        <div class="col-6">
          <div class="border border-secondary-subtle rounded-3 p-3 text-center">
            <p class="small text-body-secondary mb-1">Completed</p>
            <p id="metricCompleted" class="fs-4 fw-semibold text-success mb-0">0</p>
          </div>
        </div>

        <div class="col-6">
          <div class="border border-secondary-subtle rounded-3 p-3 text-center">
            <p class="small text-body-secondary mb-1">Pending</p>
            <p id="metricPending" class="fs-4 fw-semibold text-warning mb-0">0</p>
          </div>
        </div>

        <div class="col-6">
          <div class="border border-secondary-subtle rounded-3 p-3 text-center">
            <p class="small text-body-secondary mb-1">Completion Rate</p>
            <p id="metricRate" class="fs-4 fw-semibold mb-0">0%</p>
          </div>
        </div>

      </div>
    </section>

    <!-- Charts -->

    <section class="border border-secondary-subtle rounded-4 p-3 p-md-4 bg-body shadow-sm mb-4">
      <h2 class="fs-5 fw-medium mb-3">Completed vs Pending</h2>
      <canvas id="statusChart"></canvas>
    </section>

    <section class="border border-secondary-subtle rounded-4 p-3 p-md-4 bg-body shadow-sm">
      <h2 class="fs-5 fw-medium mb-3">Priority Distribution</h2>
      <canvas id="priorityChart"></canvas>
    </section>

  </div>

</main>

<!-- Footer -->
<div id="footer-placeholder"></div>

</body>
</html>
