<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submissions - Studio Task Manager</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/submissions.js" defer></script>
</head>
<body>
  <div id="header-placeholder" class="py-3"></div>

  <main class="py-5">
    <section class="container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1 class="fw-bold mb-1">Contact Submissions</h1>
          <p class="text-secondary mb-0">Stored (localStorage)</p>
        </div>
        <button id="clearSubmissionsBtn" class="btn btn-outline-danger rounded-pill">Clear All</button>
      </div>

      <div class="table-responsive border rounded-4">
        <table class="table table-striped align-middle mb-0">
          <thead>
            <tr>
              <th>#</th>
              <th>Date</th>
              <th>Name</th>
              <th>Email</th>
              <th>Message</th>
            </tr>
          </thead>
          <tbody id="submissionsBody"></tbody>
        </table>
      </div>

      <p id="emptyMessage" class="text-secondary mt-3 d-none">No submissions yet.</p>
    </section>
  </main>

  <div id="footer-placeholder"></div>
</body>
</html>
