<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Studio Task Manager" />
  <title>Studio Task Manager</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/tasks.js"></script>

  <style>
    .stm-navbar { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    #editModal { display: none; }
    #editModal.open { display: flex; }
  </style>
</head>

<body>

  <!-- Header -->
  <div id="header-placeholder"></div>

  <!-- editing -->
  <div id="editModal"
       class="position-fixed top-0 start-0 w-100 h-100 align-items-center justify-content-center"
       style="background:rgba(0,0,0,.5); z-index:9999;">
    <div class="bg-body rounded-4 p-4 p-md-5 mx-3 mx-sm-auto w-100" style="max-width:32rem;">
      <h2 class="fs-5 fw-semibold mb-4">Edit Task</h2>
      <form id="editTaskForm">
        <input type="hidden" id="editTaskId">

        <div class="mb-3">
          <label class="form-label small fw-medium">Title</label>
          <input id="editTitle" type="text" class="form-control" maxlength="40" required>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-medium">Description</label>
          <textarea id="editDescription" rows="3" class="form-control" required></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-medium">Due Date</label>
          <input id="editDueDate" type="date" class="form-control" required>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-12 col-sm-6">
            <label class="form-label small fw-medium">Status</label>
            <select id="editStatus" class="form-select">
              <option value="todo">To Do</option>
              <option value="in-progress">In Progress</option>
              <option value="completed">Completed</option>
            </select>
          </div>
          <div class="col-12 col-sm-6">
            <label class="form-label small fw-medium">Priority</label>
            <select id="editPriority" class="form-select">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>

        <div class="d-flex flex-column flex-sm-row justify-content-end gap-2 pt-2">
          <button type="button" id="cancelEdit"
            class="btn btn-outline-secondary rounded-pill px-4">
            Cancel
          </button>
          <button type="submit" class="btn btn-primary rounded-pill px-4">
            Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>

  <main class="pt-5 mt-4 mt-lg-5 px-3 px-md-4 pb-5">
    <div class="mx-auto w-100" style="max-width:640px;">

      <!-- heading -->
      <div class="text-center mb-4 mb-md-5 pt-3">
        <h1 class="fs-3 fw-semibold">Studio Task Manager</h1>
        <p class="text-body-secondary mt-2 mb-0 small">
          Add Tasks, Track Progress and Collaborate Seamlessly
        </p>
      </div>

      <!-- Add Task Card -->
      <section class="border border-secondary-subtle rounded-4 p-3 p-md-4 bg-body shadow-sm mb-4">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-4">
          <div>
            <h2 class="fs-5 fw-medium mb-1">Add a New Task</h2>
            <p class="small text-body-secondary mb-0">Fill in the details below</p>
          </div>
          <span class="border border-secondary-subtle rounded-pill text-body-secondary px-3 py-1"
                style="font-size:.75rem; white-space:nowrap;">
            Public Studio Board
          </span>
        </div>

        <form id="taskForm">
          <div class="mb-3">
            <label for="taskTitle" class="form-label small fw-medium text-body-secondary">
              Task Title
            </label>
            <input type="text" id="taskTitle" name="taskTitle"
              class="form-control" maxlength="40" required>
          </div>

          <div class="mb-3">
            <label for="taskDescription" class="form-label small fw-medium text-body-secondary">
              Description
            </label>
            <textarea id="taskDescription" name="taskDescription"
              rows="3" class="form-control" required></textarea>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-12 col-sm-6">
              <label for="taskStatus" class="form-label small fw-medium text-body-secondary">
                Task Status
              </label>
              <select id="taskStatus" class="form-select" required>
                <option value="">Select Status</option>
                <option value="todo">To Do</option>
                <option value="in-progress">In Progress</option>
                <option value="completed">Completed</option>
              </select>
            </div>
            <div class="col-12 col-sm-6">
              <label for="classPriority" class="form-label small fw-medium text-body-secondary">
                Priority
              </label>
              <select id="classPriority" class="form-select">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
              </select>
            </div>
          </div>

          <div class="mb-4">
            <label for="taskDueDate" class="form-label small fw-medium text-body-secondary">
              Due Date
            </label>
            <input type="date" id="taskDueDate" class="form-control" required>
          </div>

          <div class="d-flex flex-column flex-sm-row gap-2">
            <button type="submit" class="btn btn-primary rounded-pill px-4 fw-medium">
              Add Task
            </button>
            <button type="reset" class="btn btn-outline-secondary rounded-pill px-4 fw-medium">
              Clear
            </button>
          </div>
        </form>
      </section>

      <!-- Search -->
      <div class="mb-3">
        <input type="text" id="taskSearch"
          class="form-control form-control-sm"
          placeholder="Search tasks by title or description...">
      </div>

      <!-- Filter -->
      <div class="d-flex flex-column flex-sm-row align-items-sm-center gap-2 mb-4">
        <label for="statusFilter" class="form-label small fw-medium text-body-secondary mb-0">
          Filter by status:
        </label>
        <select id="statusFilter" class="form-select form-select-sm w-auto">
          <option value="all">All</option>
          <option value="todo">To Do</option>
          <option value="in-progress">In Progress</option>
          <option value="completed">Completed</option>
        </select>
      </div>

      <!-- Summary -->
      <section class="mb-4">
        <div class="row g-3">
          <div class="col-4">
            <div class="border border-secondary-subtle rounded-3 p-3 text-center">
              <p class="small text-body-secondary mb-1">Total</p>
              <p id="totalTasks" class="fs-4 fw-semibold mb-0">0</p>
            </div>
          </div>
          <div class="col-4">
            <div class="border border-secondary-subtle rounded-3 p-3 text-center">
              <p class="small text-body-secondary mb-1">Pending</p>
              <p id="pendingTasks" class="fs-4 fw-semibold mb-0">0</p>
            </div>
          </div>
          <div class="col-4">
            <div class="border border-secondary-subtle rounded-3 p-3 text-center">
              <p class="small text-body-secondary mb-1">Done</p>
              <p id="completedTasks" class="fs-4 fw-semibold mb-0">0</p>
            </div>
          </div>
        </div>
      </section>

      <!-- Task List -->
      <section class="mt-4">
        <div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-3">
          <div>
            <h2 class="fs-5 fw-medium mb-1">Current Tasks</h2>
            <p class="small text-body-secondary mb-0">
              Tasks will appear here once added.
            </p>
          </div>
        </div>
        <div id="taskList"></div>
      </section>

    </div>
  </main>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

</body>
</html>
